name: Validate on Windows

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore SimuladorCompuertrtas.slnx

      - name: Build solution
        run: dotnet build SimuladorCompuertrtas.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test SimuladorCompuertrtas.slnx --configuration Release --no-build --no-restore
